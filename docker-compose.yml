services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vote}
      POSTGRES_DB: ${POSTGRES_DB:-vote}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vote-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vote} -d ${POSTGRES_DB:-vote}"]
      interval: 5s
      timeout: 5s
      retries: 20

  blockchain:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    command: npx hardhat node --hostname 0.0.0.0
    working_dir: /app
    ports:
      - "${RPC_PORT:-8545}:8545"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:8545',{method:'POST',headers:{'content-type':'application/json'},
          body:'{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}'})
          .then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      HMAC_SECRET: ${HMAC_SECRET:-change-me}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vote}:${POSTGRES_PASSWORD:-vote}@postgres:5432/${POSTGRES_DB:-vote}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin}
      RPC_URL: http://blockchain:8545
      HARDHAT_RPC_URL: http://blockchain:8545
      CHAIN_ID: 31337
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    depends_on:
      postgres:
        condition: service_healthy
      blockchain:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3100}:3000"
    command: ["sh", "-c", "npm run chain:compile && npm run chain:deploy && exec npm start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3100}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  vote-postgres:
